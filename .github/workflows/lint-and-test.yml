name: Lint & test

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Cheap, so it runs on every branch.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: Angelo
      - run: cargo fmt --check
        working-directory: Angelo
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: Angelo

  # Expensive: needs python, pytest and coverage. Only where it pays.
  test:
    if: >
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: Angelo
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # The end-to-end tests drive a real pytest; coverage unlocks batching and
      # test selection, so without it those paths would silently go untested.
      - run: python -m pip install --upgrade pip pytest coverage
      - run: cargo test --all-targets
        working-directory: Angelo

  # Batching, test selection and warm workers are pure speed features. If any
  # of them changes a score, that is a correctness bug, not a tuning question.
  verdicts:
    if: >
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: Angelo
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest coverage
      - run: cargo build --release
        working-directory: Angelo
      # bash, not ./, because the exec bit does not survive a Windows commit.
      # Run from the repository root: the script finds the binary under Angelo/.
      - run: bash scripts/verdict-matrix.sh
