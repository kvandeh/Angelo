[project]
site_name = "angelo"
site_description = "Fast mutation testing for Python. One Rust binary, installed through pip."
site_author = "Kieran"
copyright = "Copyright &copy; 2026"

nav = [
  { "Overview" = "index.md" },
  { "Batch mutating" = "01-batch-mutating.md" },
  { "Test selection" = "02-test-selection.md" },
  { "Warm workers" = "03-warm-workers.md" },
  { "Architecture" = "04-architecture.md" },
  { "Benchmarks" = "05-benchmarks.md" },
  { "Operators and sampling" = "06-operators-and-sampling.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# The notes lean on tables, admonitions and mermaid diagrams. superfences with
# the mermaid custom fence is what makes ```mermaid blocks render as diagrams.
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
