[project]
site_name = "Angelo"
site_description = "Python mutation testing is slow and expensive, but what if it wasn't?"
site_author = "Kieran van der Heijde"
site_url = "https://angelo.kcvdh.com/"
repo_url = "https://github.com/kvandeh/angelo"
repo_name = "kvandeh/angelo"

# The social icons carry the links, so the text does not repeat them.
copyright = "Written and owned by <strong>Kieran van der Heijde</strong>"

nav = [
  { "Home" = "index.md" },
  { "Quick Start" = "quick-start.md" },
  { "Batch mutating" = "01-batch-mutating.md" },
  { "Test selection" = "02-test-selection.md" },
  { "Warm workers" = "03-warm-workers.md" },
  { "Schemata" = "08-schemata.md" },
  { "Architecture" = "04-architecture.md" },
  { "Benchmarks" = "05-benchmarks.md" },
  { "Operators and sampling" = "06-operators-and-sampling.md" },
  { "Reports" = "07-reports.md" },
  { "Support" = "support.md" },
]

[project.theme]
language = "en"
features = [
  "content.action.view",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

# Dark first, so that is what a visitor gets before touching the toggle.
[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/kvandeh/angelo"
name = "angelo on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/in/kcvdh"
name = "Kieran on LinkedIn"

[[project.extra.social]]
icon = "fontawesome/solid/heart"
link = "https://github.com/sponsors/kvandeh"
name = "Sponsor angelo"

# The notes lean on tables, admonitions and mermaid diagrams. superfences with
# the mermaid custom fence is what makes ```mermaid blocks render as diagrams.
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
